<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#ffffff" />
    <title>네이버페이 스코어 — 생성 중</title>

    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="stylesheet" href="styles.css" />

    <style>
      .loading-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        flex: 1;
        padding: 0 24px;
        text-align: center;
      }

      .loading-title {
        font-size: 22px;
        font-weight: 700;
        line-height: 1.4;
        letter-spacing: -0.5px;
        color: var(--gray900);
        margin-bottom: 8px;
      }
      .loading-title em {
        font-style: normal;
        color: var(--green400);
      }

      .loading-sub {
        font-size: 13px;
        color: var(--gray500);
        letter-spacing: -0.2px;
        margin-bottom: 48px;
      }

      /* ===== 도넛 로딩 ===== */
      .donut {
        position: relative;
        width: 180px;
        height: 180px;
        margin-bottom: 48px;
      }
      .donut svg {
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
      }
      .donut__track {
        fill: none;
        stroke: var(--gray200);
        stroke-width: 10;
      }
      .donut__fill {
        fill: none;
        stroke: var(--green400);
        stroke-width: 10;
        stroke-linecap: round;
        stroke-dasharray: 502;
        stroke-dashoffset: 502;
        animation: donut-fill 3.5s ease-out forwards;
      }
      @keyframes donut-fill {
        to { stroke-dashoffset: 0; }
      }
      .donut__pct {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
        font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 38px;
        font-weight: 700;
        color: var(--gray900);
        letter-spacing: -0.04em;
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }
      .donut__pct small {
        font-size: 18px;
        font-weight: 600;
        color: var(--gray500);
        margin-left: 2px;
      }

      /* ===== 분석 단계 리스트 ===== */
      .steps {
        width: 100%;
        max-width: 280px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .step {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 14px;
        font-weight: 600;
        color: var(--gray400);
        letter-spacing: -0.3px;
        opacity: 0.5;
        transition: opacity 400ms var(--ease-out-quart),
                    color 400ms var(--ease-out-quart);
      }
      .step.is-active {
        opacity: 1;
        color: var(--gray900);
      }
      .step.is-done {
        opacity: 1;
        color: var(--green500);
      }
      .step__dot {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--gray200);
        display: grid;
        place-items: center;
        flex-shrink: 0;
        transition: background 300ms var(--ease-out-quart);
      }
      .step.is-active .step__dot {
        background: var(--green400);
        box-shadow: 0 0 0 4px rgba(0, 205, 96, 0.15);
        animation: step-pulse 1.2s ease-in-out infinite;
      }
      .step.is-done .step__dot {
        background: var(--green400);
      }
      .step.is-done .step__dot::after {
        content: "";
        width: 8px;
        height: 4px;
        border-left: 1.5px solid #fff;
        border-bottom: 1.5px solid #fff;
        transform: translateY(-1px) rotate(-45deg);
      }
      @keyframes step-pulse {
        0%, 100% { box-shadow: 0 0 0 4px rgba(0, 205, 96, 0.15); }
        50%      { box-shadow: 0 0 0 7px rgba(0, 205, 96, 0.05); }
      }
    </style>
  </head>
  <body>
    <main class="frame">
      <div class="app">
        <section
          class="view is-active"
          aria-label="네이버페이 스코어 생성 중"
        >
          <header class="gnb">
            <div class="gnb__tabs">
              <span class="gnb__tab">금융 홈</span>
              <span class="gnb__tab is-active">신용점수</span>
              <span class="gnb__tab">대출비교</span>
            </div>
          </header>

          <div class="scroll" style="display:flex;flex-direction:column;">
            <div class="loading-wrap" style="padding-top:40px;">
              <h1 class="loading-title">
                <em>나만의 스코어</em>를<br />
                만들고 있어요
              </h1>
              <p class="loading-sub">잠시만 기다려 주세요</p>

              <div class="donut">
                <svg viewBox="0 0 180 180">
                  <circle class="donut__track" cx="90" cy="90" r="80" />
                  <circle class="donut__fill"  cx="90" cy="90" r="80" />
                </svg>
                <div class="donut__pct"><span id="pct">0</span><small>%</small></div>
              </div>

              <div class="steps">
                <div class="step" data-step="1">
                  <span class="step__dot"></span>
                  <span>네이버페이 활동 분석</span>
                </div>
                <div class="step" data-step="2">
                  <span class="step__dot"></span>
                  <span>금융 패턴 추출</span>
                </div>
                <div class="step" data-step="3">
                  <span class="step__dot"></span>
                  <span>나만의 스코어 산정</span>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <script>
      /* 퍼센트 카운터 */
      const pctEl = document.getElementById("pct");
      const DURATION = 3500;
      const start = performance.now();
      function tick(now) {
        const p = Math.min(1, (now - start) / DURATION);
        pctEl.textContent = Math.floor(p * 100);
        if (p < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);

      /* 단계 진행 */
      const steps = document.querySelectorAll(".step");
      const schedule = [
        { t: 0,    activate: 0 },
        { t: 1200, done: 0, activate: 1 },
        { t: 2400, done: 1, activate: 2 },
        { t: 3400, done: 2 },
      ];
      schedule.forEach(({ t, activate, done }) => {
        setTimeout(() => {
          if (done !== undefined) {
            steps[done].classList.remove("is-active");
            steps[done].classList.add("is-done");
          }
          if (activate !== undefined) {
            steps[activate].classList.add("is-active");
          }
        }, t);
      });

      /* 완료 후 결과 페이지(블라인드 해제 상태)로 이동 */
      setTimeout(() => {
        location.href = "index.html?revealed=1";
      }, DURATION + 300);
    </script>
  <!-- Demo navigation toggle -->
  <div id="dt" style="position:fixed;top:16px;right:16px;z-index:9999;background:#fff;border-radius:14px;padding:8px;box-shadow:0 4px 16px rgba(0,0,0,.14);font-family:'Pretendard Variable',sans-serif;">
    <div style="font-size:10px;font-weight:700;color:#999;letter-spacing:.6px;text-transform:uppercase;padding:0 4px 6px;">케이스 전환</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:2px;">
      <button data-nav="main-pre"   style="padding:7px 14px;border:none;background:transparent;font-size:13px;font-weight:600;color:#555;border-radius:10px;cursor:pointer;white-space:nowrap;letter-spacing:-.3px;font-family:inherit;">메인(생성전)</button>
      <button data-nav="main-done"  style="padding:7px 14px;border:none;background:transparent;font-size:13px;font-weight:600;color:#555;border-radius:10px;cursor:pointer;white-space:nowrap;letter-spacing:-.3px;font-family:inherit;">메인(생성완료)</button>
      <button data-nav="score-pre"  style="padding:7px 14px;border:none;background:transparent;font-size:13px;font-weight:600;color:#555;border-radius:10px;cursor:pointer;white-space:nowrap;letter-spacing:-.3px;font-family:inherit;">스코어(생성전)</button>
      <button data-nav="score-done" style="padding:7px 14px;border:none;background:transparent;font-size:13px;font-weight:600;color:#555;border-radius:10px;cursor:pointer;white-space:nowrap;letter-spacing:-.3px;font-family:inherit;">스코어(생성완료)</button>
    </div>
  </div>
  <script>
    (function(){
      var active = 'score-pre';
      document.querySelectorAll('#dt [data-nav]').forEach(function(b){
        if(b.dataset.nav === active){ b.style.background='#1a1a1a'; b.style.color='#fff'; }
        b.addEventListener('click', function(){
          var n = b.dataset.nav;
          if     (n==='main-pre')   location.href='https://swg2210.github.io/npscore-prototype/?case=pre';
          else if(n==='main-done')  location.href='https://swg2210.github.io/npscore-prototype/';
          else if(n==='score-pre')  location.href='https://swg2210.github.io/socre/';
          else if(n==='score-done') location.href='https://swg2210.github.io/socre/index.html?revealed=1';
        });
      });
    })();
  </script>  </body>
</html>
